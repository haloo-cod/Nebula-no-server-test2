backend:
  name: github
  repo: haloo-cod/Nebula-no-server-test2
  branch: main
  site_domain: nebula-no-server-test2.vercel.app
  base_url: https://nebula-no-server-test2.vercel.app
  auth_endpoint: /api/auth?action=authorize

locale: zh_Hans

media_folder: "public/assets/images"
public_folder: "/assets/images"

collections:
  - name: posts
    label: 文章
    folder: src/content/posts
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: 标题, widget: string }
      - { name: published, label: 发布日期, widget: datetime, required: false }
      - { name: updated, label: 更新日期, widget: datetime, required: false }
      - { name: description, label: 摘要, widget: text, required: false }
      - { name: cover, label: 封面, widget: image, required: false }
      - { name: tags, label: 标签, widget: list, required: false, default: [] }
      - { name: category, label: 分类, widget: string, required: false }
      - { name: draft, label: 草稿, widget: boolean, default: false }
      - { name: pinned, label: 置顶, widget: boolean, default: false }
      - { name: body, label: 正文, widget: markdown }

  - name: gallery
    label: 展览项目
    folder: src/content/gallery
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: 标题, widget: string }
      - { name: description, label: 描述, widget: text, required: false }
      - { name: tags, label: 标签, widget: list, required: false, default: [] }
      - { name: status, label: 状态, widget: string, required: false }
      - { name: year, label: 年份, widget: string, required: false }
      - { name: featured, label: 精选, widget: boolean, default: false }
      - { name: body, label: 文档, widget: markdown }

  - name: moments
    label: 说说
    files:
      - name: moments
        label: 说说列表
        file: src/content/moments.json
        fields:
          - name: items
            label: 说说
            widget: list
            required: false
            fields:
              - { name: id, label: 标识, widget: string, required: false }
              - { name: date, label: 日期, widget: datetime }
              - { name: content, label: 内容, widget: text }
              - { name: mood, label: 心情, widget: string, required: false }
              - { name: moodText, label: 心情描述, widget: string, required: false }
              - name: tags
                label: 标签
                widget: list
                required: false
                field: { name: tag, label: 标签, widget: string }
              - name: images
                label: 图片
                widget: list
                required: false
                field: { name: image, label: 图片, widget: image }
              - { name: likes, label: 点赞数, widget: number, required: false }

  - name: site-data
    label: 站点数据
    files:
      - name: friends
        label: 友链
        file: src/content/friends.json
        fields:
          - name: items
            label: 友链
            widget: list
            required: false
            fields:
              - { name: name, label: 名称, widget: string }
              - { name: bio, label: 简介, widget: string }
              - { name: avatar, label: 头像, widget: image }
              - { name: url, label: 地址, widget: string }
          - name: exchange
            label: 友链交换信息
            widget: object
            fields:
              - { name: enabled, label: 启用申请, widget: boolean, required: false }
              - { name: name, label: 站点名称, widget: string, required: false }
              - { name: url, label: 站点地址, widget: string, required: false }
              - { name: avatar, label: 头像, widget: string, required: false }
              - { name: bio, label: 简介, widget: text, required: false }
              - name: requirements
                label: 申请要求
                widget: list
                required: false
                field: { name: requirement, label: 要求, widget: string }
              - { name: contact, label: 联系方式, widget: string, required: false }
      - name: profile
        label: 个人资料
        file: src/content/profile.json
        fields:
          - { name: name, label: 昵称, widget: string }
          - { name: bio, label: 简介, widget: text }
          - { name: avatar, label: 头像, widget: image, required: false }
          - { name: cover, label: 封面, widget: image, required: false }
          - name: socialLinks
            label: 社交链接
            widget: list
            required: false
            fields:
              - { name: label, label: 名称, widget: string }
              - { name: icon, label: 图标, widget: string }
              - { name: url, label: 地址, widget: string }
      - name: backgrounds
        label: 背景
        file: src/content/backgrounds.json
        fields:
          - name: dark
            label: 暗色背景
            widget: object
            fields:
              - name: desktop
                label: 桌面端背景
                widget: list
                required: false
                fields:
                  - { name: src, label: 图片或视频地址, widget: string }
                  - { name: mediaType, label: 媒体类型, widget: select, options: [image, video], default: image, required: false }
                  - { name: posterUrl, label: 视频封面, widget: string, required: false }
                  - { name: mimeType, label: MIME 类型, widget: string, required: false }
              - name: mobile
                label: 移动端背景
                widget: list
                required: false
                fields:
                  - { name: src, label: 图片或视频地址, widget: string }
                  - { name: mediaType, label: 媒体类型, widget: select, options: [image, video], default: image, required: false }
                  - { name: posterUrl, label: 视频封面, widget: string, required: false }
                  - { name: mimeType, label: MIME 类型, widget: string, required: false }
          - name: light
            label: 亮色背景
            widget: object
            fields:
              - name: desktop
                label: 桌面端背景
                widget: list
                required: false
                fields:
                  - { name: src, label: 图片或视频地址, widget: string }
                  - { name: mediaType, label: 媒体类型, widget: select, options: [image, video], default: image, required: false }
                  - { name: posterUrl, label: 视频封面, widget: string, required: false }
                  - { name: mimeType, label: MIME 类型, widget: string, required: false }
              - name: mobile
                label: 移动端背景
                widget: list
                required: false
                fields:
                  - { name: src, label: 图片或视频地址, widget: string }
                  - { name: mediaType, label: 媒体类型, widget: select, options: [image, video], default: image, required: false }
                  - { name: posterUrl, label: 视频封面, widget: string, required: false }
                  - { name: mimeType, label: MIME 类型, widget: string, required: false }
      - name: carousel
        label: 首页轮播
        file: src/content/carousel.json
        fields:
          - name: items
            label: 轮播图
            widget: list
            required: false
            fields:
              - { name: src, label: 图片, widget: image }
              - { name: alt, label: 描述, widget: string, required: false }
      - name: treasures
        label: 藏宝阁
        file: src/content/treasures.json
        fields:
          - name: items
            label: 条目
            widget: list
            required: false
            fields:
              - { name: slug, label: 标识, widget: string }
              - { name: title, label: 标题, widget: string }
              - { name: description, label: 描述, widget: text }
              - { name: category, label: 分类, widget: string }
              - { name: icon, label: 图标, widget: string }
              - { name: url, label: 地址, widget: string }
              - name: tags
                label: 标签
                widget: list
                required: false
                field: { name: tag, label: 标签, widget: string }

      - name: albums
        label: 相册
        file: src/content/albums.json
        fields:
          - name: items
            label: 相册列表
            widget: list
            required: false
            fields:
              - { name: id, label: 标识, widget: string, required: false }
              - { name: title, label: 标题, widget: string }
              - { name: description, label: 简介, widget: text, required: false }
              - { name: cover, label: 封面, widget: image, required: false }
              - { name: date, label: 日期, widget: string, required: false }
              - { name: orientation, label: 排列方向, widget: select, options: [landscape, portrait], default: landscape }
              - name: photos
                label: 照片
                widget: list
                required: false
                fields:
                  - { name: url, label: 图片, widget: image }
                  - { name: caption, label: 图片说明, widget: string, required: false }

      - name: about
        label: 关于页内容
        file: src/content/about.md
        fields:
          - { name: body, label: 正文, widget: markdown }
